name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Require the production Worker origin
        env:
          MAK_WORKER_ORIGIN: ${{ vars.MAK_WORKER_ORIGIN }}
        run: node scripts/validate-pages-origin.mjs

      - name: Verify read-only Worker CORS preflight
        env:
          MAK_WORKER_ORIGIN: ${{ vars.MAK_WORKER_ORIGIN }}
        run: node scripts/check-worker-preflight.mjs

      - name: Install JavaScript build dependencies
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint

      - name: Build and test site
        env:
          MAK_WORKER_ORIGIN: ${{ vars.MAK_WORKER_ORIGIN }}
          MAK_REQUIRE_WORKER_ORIGIN: "true"
        run: npm test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
